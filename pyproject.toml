[project]
name = "ai-devops-agent"
version = "0.1.0"
description = "A staged, evidence-based learning project for incident investigation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2,<1",
    "gitpython>=3.2,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    # The resolved Starlette TestClient prefers HTTPX2.
    "httpx2>=2.13.1,<3",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
# Reuse the portfolio's two-week release cutoff; uv.lock pins exact versions.
exclude-newer = "2026-10-09T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Shared offline test helpers import as local modules from tests/.
known-local-folder = ["docker_fake", "git_lab"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
